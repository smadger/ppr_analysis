[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppr-analysis"
version = "0.1.0"
description = "Drogheda PPR sales enriched with Daft sold-listing attributes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ppr-analysis = "ppr_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
